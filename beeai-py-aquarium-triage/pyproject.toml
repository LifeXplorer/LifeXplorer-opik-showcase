[project]
name = "beeai-py-aquarium-triage"
version = "0.1.0"
description = "A BeeAI ReAct agent that triages aquarium water-quality alerts, traced into Opik via OpenInference"
requires-python = ">=3.12"
dependencies = [
    "beeai-framework==0.1.86",
    "openinference-instrumentation-beeai==0.1.39",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opik==2.3.4",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
