[project]
name = "crewai-wedding-planner"
version = "0.1.0"
description = "Three CrewAI agents draft a wedding-day plan; Opik shows one trace with tokens and cost per agent."
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.17",
    "opik>=2.2.35",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
