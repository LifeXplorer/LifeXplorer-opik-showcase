[project]
name = "dspy-chess-openings-qa"
version = "0.1.0"
description = "A DSPy chess-openings QA program that compiles its own few-shot prompt, measured as uncompiled vs compiled pass rate on one suite."
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
