name: n8n-foodbank

services:
  n8n:
    build: .
    container_name: n8n-foodbank-screening
    ports:
      - "5680:5678"
    # Lets the container reach an Opik stack running on the host (Linux needs this line).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # --- Opik integration (OpenTelemetry export) ---
      # Every execution becomes a trace, every node a span. The projectName
      # header routes them into the "n8n-foodbank-volunteer-screening" project.
      # Defaults target a local Opik at localhost:5173 (no API key needed);
      # for Opik Cloud override both variables, e.g.
      #   OPIK_OTEL_ENDPOINT=https://www.comet.com/opik/api/v1/private/otel
      #   OPIK_OTEL_HEADERS=Authorization=<key>,Comet-Workspace=<ws>,projectName=n8n-foodbank-volunteer-screening
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OPIK_OTEL_ENDPOINT:-http://host.docker.internal:5173/api/v1/private/otel}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OPIK_OTEL_HEADERS:-Comet-Workspace=default,projectName=n8n-foodbank-volunteer-screening}"
      N8N_OTEL_SERVICE_NAME: "n8n-foodbank-volunteer-screening"

      # --- plain n8n settings for a localhost demo ---
      N8N_SECURE_COOKIE: "false"       # allow login over plain http://localhost
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false" # no n8n telemetry; Opik is the telemetry
    volumes:
      - n8n_foodbank_data:/home/node/.n8n

volumes:
  n8n_foodbank_data:
