[project]
name = "openai-py-storybook-illustrator"
version = "0.1.0"
description = "A children's storybook illustrator on the OpenAI Python SDK, with prompt briefs versioned in Opik and every picture attached to its trace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opik==2.3.4",
    "openai>=1.99,<3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
