[project]
name = "openai-vision-shipping-labels"
version = "0.1.0"
description = "GPT-4o-mini vision reads typed fields off generated shipping-label images"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.57.0",
    "opik>=2.3.4",
    "pillow>=11.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
