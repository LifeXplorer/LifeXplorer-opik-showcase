[project]
name = "optimizer-podcast-topic-classifier"
version = "0.1.0"
description = "Classify podcast episodes into topics with a plain LLM prompt"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "opik>=2.3.4",
    "opik-optimizer>=3.2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
