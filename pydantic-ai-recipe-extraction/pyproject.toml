[project]
name = "pydantic-ai-recipe-extraction"
version = "0.1.0"
description = "Pydantic AI agent that turns messy home-cook notes into typed RecipeCards, traced over OTel and tested for invented values with Opik"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "logfire>=4.40.0",
    "opik>=2.2.31",
    "pydantic-ai>=2.31.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
