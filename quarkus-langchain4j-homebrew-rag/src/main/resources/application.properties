quarkus.http.port=8310
quarkus.application.name=copperkettle-faq

# Chat model + embeddings, both on OpenAI. The key comes from the environment.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.1
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
quarkus.langchain4j.openai.timeout=60s

# Where the FAQ markdown lives (relative to the working directory).
faq.docs-dir=docs
faq.top-k=3
faq.min-score=0.3

# --- Opik over OTLP ---
# No Opik SDK: Quarkus' OpenTelemetry exporter posts spans to Opik's OTLP endpoint.
# Comet-Workspace picks the workspace, projectName the project the traces land in.
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=${OPIK_OTLP_ENDPOINT:http://localhost:5173/api/v1/private/otel}
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
quarkus.otel.exporter.otlp.traces.headers=Comet-Workspace=${OPIK_WORKSPACE:default},projectName=${OPIK_PROJECT_NAME:quarkus-langchain4j-homebrew-rag}
# Export batches every 200 ms so a short scripted run is shipped while the app is still up.
quarkus.otel.bsp.schedule.delay=200ms
# Only traces go to Opik; without these Quarkus also tries to export logs and metrics to localhost:4318.
quarkus.otel.logs.enabled=false
quarkus.otel.metrics.enabled=false

# Put prompt and completion text on the llm span. Both default to false, which leaves the span with
# model + token counts but an empty Input/Output in Opik.
quarkus.langchain4j.tracing.include-prompt=true
quarkus.langchain4j.tracing.include-completion=true
