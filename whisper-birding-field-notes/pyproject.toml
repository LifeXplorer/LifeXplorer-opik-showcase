[project]
name = "whisper-birding-field-notes"
version = "0.1.0"
description = "Birdwatcher voice notes -> Whisper transcript -> species sighting log, traced in Opik with the MP3 attached and a judge suite tamed by execution_policy"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.57.0",
    "opik>=2.3.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
